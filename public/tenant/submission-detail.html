<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Submission — LatLomp Client Form</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/tenant/dashboard" class="logo" style="text-decoration:none;">LatLomp</a>
      <nav>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
        <div class="nav-links" id="navLinks"></div>
      </nav>
    </div>
  </header>

  <main class="container" style="padding-top: var(--space-xl); max-width: 700px;">
    <p style="margin-bottom: var(--space-sm);"><a href="/tenant/submissions">&larr; Submissions</a></p>
        <div id="submissionContent"><p>Loading...</p></div>

    <div id="messageThreadSection" style="display:none; margin-top:var(--space-lg);">
      <h3 style="margin-bottom: var(--space-md);">Messages</h3>
      <div id="messagesList" style="margin-bottom: var(--space-md);"></div>
      <form id="messageForm">
        <div class="form-group">
          <textarea class="form-textarea" id="messageBody" rows="3" placeholder="Message your client..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="sendMessageBtn">Send</button>
        <div id="messageAlert"></div>
      </form>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script src="/js/siteNav.js"></script>
  <script src="/js/tenantNav.js"></script>
  <script src="/js/submissionDetail.js"></script>
</body>
</html>
